// proto/spellcheck.proto
syntax = "proto3";

package spellcheck.v1;

service Spellchecker {
  // Unary call: the orchestrator sends text plus the words its fast
  // dictionary pre-filter flagged. Python only reasons about those spans.
  // ARCH NOTE: add `rpc CheckStream(stream SpellcheckRequest) returns
  // (stream SpellcheckResponse)` for token-by-token streaming later.
  rpc Check(SpellcheckRequest) returns (SpellcheckResponse);
  // Local text editing and model discovery follow the review workflow in
  // TextEnhanceAI by wenrolland (GPL-3.0): https://github.com/wenrolland/TextEnhanceAI.
  rpc Enhance(EnhanceRequest) returns (EnhanceResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}

// A flagged word. Offsets are UTF-16 code units so they map 1:1 onto
// JavaScript string indices in the renderer.
message Span {
  int32 start = 1;
  int32 end = 2;   // exclusive
  string word = 3;
}

message SpellcheckRequest {
  string request_id = 1;
  string text = 2;               // full text, for context
  string language = 3;           // BCP-47, e.g. "en", "en-GB"
  repeated Span suspect_spans = 4;
}

message Suggestion {
  int32 start = 1;
  int32 end = 2;
  string original = 3;
  repeated string candidates = 4;  // ranked best-first
  float confidence = 5;            // 0.0 - 1.0
  string explanation = 6;          // optional, shown in the UI
}

message SpellcheckResponse {
  string request_id = 1;
  repeated Suggestion suggestions = 2;
  string model = 3;                // which backend/model answered
}

message EnhanceRequest {
  string request_id = 1;
  string text = 2;
  string instruction = 3;
  string model = 4;
}

message EnhanceResponse {
  string request_id = 1;
  string proposed_text = 2;
  string model = 3;
}

message ListModelsRequest {
  string request_id = 1;
}

message ListModelsResponse {
  string request_id = 1;
  repeated string models = 2;
}