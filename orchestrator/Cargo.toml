# orchestrator/Cargo.toml
[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
lru = "0.12"

[build-dependencies]
tonic-build = "0.12"   # requires `protoc` on PATH