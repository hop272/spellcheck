[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-spellchecker-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.62",
  "grpcio-tools>=1.62",
  "protobuf>=4.25",
]

[project.optional-dependencies]
transformers = ["transformers>=4.44", "torch", "accelerate"]
llama = ["llama-cpp-python"]

[tool.setuptools]
py-modules = ["main", "ai_service"]